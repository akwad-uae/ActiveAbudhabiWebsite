<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efefef">
<title>Active Abu Dhabi</title>
<meta name="description" content="A Healthier. Happier. Stronger. Abu Dhabi — Move. Live. Belong.">
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/AcuminVariableConcept.otf" as="font" type="font/otf" crossorigin>
<style>
/* =========================================================
   Active Abu Dhabi — UI from "Avtive App.ai" (1125 px artboard)
   Every size below is the artboard value ÷ 2.556 (1125 → 440 frame)
   Font: Acumin Variable Concept (ExtraLight → Bold via the wght axis)
   ========================================================= */
@font-face{
  font-family:'Acumin Variable Concept';
  src:url('assets/fonts/AcuminVariableConcept.otf') format('opentype-variations'),
      url('assets/fonts/AcuminVariableConcept.otf') format('opentype');
  font-weight:100 900;
  font-stretch:50% 115%;
  font-style:normal;
  font-display:swap;
}
:root{
  --bg:#efefef; --card:#ffffff; --card-2:#f6f6f6;
  --line:#d9d9d9; --line-2:#a1a1a1;
  --text:#333333; --muted:#a1a1a1; --muted-2:#8a8a8a;
  --accent:#ec6337; --accent-dark:#d9532a; --dot:#808080;
  --star:#f5a623; --ok:#2fb36b;
  --frame:440px; --gutter:18px; --nav-h:92px;
  --font:'Acumin Variable Concept','Acumin Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --r-card:15px; --r-tile:14px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--font); font-weight:400;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%; overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
img{display:block;max-width:100%}
h1,h2,h3,h4,p{margin:0}
a{color:inherit;text-decoration:none}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}
.scrollx::-webkit-scrollbar{display:none}
.scrolly{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}
.scrolly::-webkit-scrollbar{display:none}
.w300{font-weight:300}.w500{font-weight:500}.w600{font-weight:600}.w700{font-weight:700}

/* ================= SPLASH ================= */
.splash{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:var(--bg);transition:opacity .55s ease,visibility .55s ease;
  animation:splashOut .55s ease 3s forwards;
}
.splash.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
@keyframes splashOut{to{opacity:0;visibility:hidden;pointer-events:none}}
.splash__inner{position:relative;text-align:center;padding:0 24px;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.splash__logo{width:min(230px,60vw);height:auto;margin:0 auto 22px}
.splash__tag{font-size:13px;font-weight:300;letter-spacing:.4px;color:var(--text)}
.splash__tag b{font-weight:600;color:var(--accent)}
.splash__bar{width:120px;height:3px;margin:26px auto 0;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden}
.splash__bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--accent);animation:load 2.9s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes load{to{width:100%}}

/* ================= STAGE / FRAME ================= */
.stage{min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
.phone{width:100%;max-width:var(--frame);background:var(--bg);position:relative;min-height:100vh;min-height:100dvh}
.view{padding:0 var(--gutter) calc(var(--nav-h) + 24px);animation:viewIn .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view--sub{padding-top:18px}

/* ================= BRAND HEADER ================= */
.brand{padding:30px 0 0;text-align:center}
.brand__logo{width:152px;height:auto;margin:0 auto}
.brand__rule{margin:20px 0 0;height:0;border:0;border-top:1px solid var(--line-2);opacity:.55}

/* ================= HEADER (home) ================= */
.header{display:flex;align-items:center;gap:15px;padding:22px 0 0}
.avatar{flex:0 0 auto;width:41px;height:41px;border-radius:50%;padding:2px;background:var(--accent)}
.avatar__inner{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#d9d9d9;border:2px solid #fff}
.avatar__inner img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.header__greet{flex:1 1 auto;min-width:0}
.header__hello{font-size:14px;line-height:18px;font-weight:300;color:var(--text)}
.header__name{font-size:14px;line-height:18px;font-weight:700}
.bell{position:relative;flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;transition:transform .15s ease}
.bell:active{transform:scale(.93)}
.bell img{width:14px;height:auto}
.badge{
  position:absolute;top:-4px;right:-6px;min-width:15px;height:15px;padding:0 4px;border-radius:99px;
  background:var(--accent);color:#fff;font-size:9px;line-height:15px;font-weight:500;text-align:center;
}

/* ================= HERO ================= */
.hero{margin-top:26px}
.hero__title{font-size:27px;line-height:32px;font-weight:600;letter-spacing:-.1px}

.slider{position:relative;margin-top:12px}
.slider__track{display:flex;gap:12px;scroll-snap-type:x mandatory;padding-bottom:2px}
.slider__track>*{flex:0 0 100%;scroll-snap-align:start}
.dots{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:99px;background:var(--dot);opacity:.85;transition:width .25s ease,background .25s ease;cursor:pointer}
.dots i.is-on{width:24px;background:var(--accent);opacity:1}

.banner{position:relative;height:148px;border-radius:14px;overflow:hidden;isolation:isolate;display:block;width:100%;background:#0d0d0d;transition:transform .15s ease}
.banner:active{transform:scale(.99)}
.banner__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 50%;pointer-events:none}
.banner__scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.25) 45%,rgba(0,0,0,0) 70%)}
.banner__body{position:absolute;left:20px;right:20px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.banner__title{font-size:14.5px;line-height:20px;font-weight:500;color:#fff}
.banner__title em{font-style:normal;color:var(--accent)}
.banner__sub{margin-top:8px;font-size:13px;line-height:16px;font-weight:200;letter-spacing:.2px;color:#fff}
.banner__btn{margin-top:9px;align-self:flex-start;padding:0 12px;height:20px;line-height:20px;border-radius:99px;background:var(--accent);color:#fff;font-size:9.5px;font-weight:600}

/* ================= SECTION HEAD ================= */
.section{margin-top:30px}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sechead__title{font-size:23.5px;line-height:26px;font-weight:600;letter-spacing:-.2px}
.sechead__title--caps{text-transform:uppercase;font-weight:700;letter-spacing:.1px}
.link{flex:0 0 auto;font-size:14px;line-height:20px;font-weight:400;color:var(--accent);text-transform:uppercase;letter-spacing:.2px;padding:2px 0}
.link:active{opacity:.6}
.sechead__sub{margin-top:2px;font-size:14px;line-height:18px;font-weight:300;color:var(--text)}
.rail{display:flex;gap:15px;margin-top:14px;padding:0 var(--gutter) 4px;margin-left:calc(-1 * var(--gutter));margin-right:calc(-1 * var(--gutter));scroll-snap-type:x proximity;scroll-padding-left:var(--gutter)}
.rail>*{scroll-snap-align:start}

/* circular orange arrow */
.go{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff}
.go svg{width:8px;height:8px;display:block}
.go--lg{width:26px;height:26px}
.go--lg svg{width:10px;height:10px}

/* ================= WHAT'S ON (event tiles) ================= */
.event{flex:0 0 150px;height:146px;position:relative;border-radius:11px;overflow:hidden;background:#222;transition:transform .15s ease}
.event:active{transform:scale(.97)}
.event img{width:100%;height:100%;object-fit:cover;object-position:50% 0}
.event__foot{position:absolute;left:0;right:0;bottom:0;padding:10px 9px 8px 11px;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;
  background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.55) 100%)}
.event__meta{color:#fff;font-size:9px;line-height:13px;font-weight:400;text-transform:uppercase;letter-spacing:.2px}
.event__meta span{display:flex;align-items:center;gap:4px;white-space:nowrap}
.event__meta svg{width:9px;height:9px;flex:0 0 auto}

/* ================= CLASS TILES ================= */
.ctile{flex:0 0 150px;border-radius:11px;overflow:hidden;background:#fff;display:flex;flex-direction:column;transition:transform .15s ease}
.ctile:active{transform:scale(.97)}
.ctile__img{height:139px;background:#ddd}
.ctile__img img{width:100%;height:100%;object-fit:cover}
.ctile__body{padding:11px 11px 10px 12px}
.ctile__top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ctile__title{font-size:14px;line-height:18px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctile__foot{margin-top:9px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;min-height:24px}
.ctile__logo{height:22px;width:auto;max-width:72px;object-fit:contain;object-position:left bottom}
.ctile__prov{font-size:9px;line-height:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;max-width:76px}
.rating{display:flex;align-items:center;gap:3px;font-size:10px;line-height:12px;font-weight:500;color:var(--text);flex:0 0 auto}
.rating svg{width:10px;height:10px;fill:var(--star)}

/* ================= VENUE CARDS ================= */
.vcard{display:flex;gap:16px;align-items:stretch;width:100%;padding:8px;background:#fff;border-radius:11px;transition:transform .15s ease}
.vcard:active{transform:scale(.99)}
.vcard+.vcard{margin-top:10px}
.vcard__img{flex:0 0 134px;height:90px;border-radius:8px;overflow:hidden;background:#ddd}
.vcard__img img{width:100%;height:100%;object-fit:cover}
.vcard__body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;padding:12px 8px 8px 0}
.vcard__top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.vcard__title{font-size:14px;line-height:18px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard__desc{margin-top:9px;font-size:8.5px;line-height:11.5px;font-weight:300;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ================= PARTNER CHALLENGES ================= */
.ptile{flex:0 0 150px;height:150px;position:relative;border-radius:11px;overflow:hidden;background:#333;transition:transform .15s ease}
.ptile:active{transform:scale(.97)}
.ptile img{width:100%;height:100%;object-fit:cover}
.ptile__foot{position:absolute;left:0;right:0;bottom:0;padding:9px 9px 9px 11px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.ptile__cap{color:#fff;font-size:9px;line-height:12px;font-weight:400;text-transform:uppercase;letter-spacing:0;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.35)}

/* ================= REWARDS ================= */
.reward{display:flex;align-items:center;gap:0;width:100%;height:73px;padding:0 18px 0 22px;background:#fff;border-radius:15px;transition:transform .15s ease}
.reward:active{transform:scale(.99)}
.reward+.reward{margin-top:8px}
.reward__icon{flex:0 0 92px;display:flex;align-items:center;justify-content:flex-start}
.reward__icon img{height:44px;width:auto;max-width:46px;object-fit:contain}
.reward__body{flex:1 1 auto;min-width:0}
.reward__title{font-size:14px;line-height:17px;font-weight:400}
.reward__sub{margin-top:2px;font-size:8.5px;line-height:11px;font-weight:300;color:var(--muted)}
.reward__pts{font-size:27px;line-height:27px;font-weight:700;letter-spacing:-.2px}

/* ================= BOTTOM NAV ================= */
.nav{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:120;width:100%;max-width:var(--frame);
  height:var(--nav-h);padding:14px 14px calc(12px + env(safe-area-inset-bottom));
  background:var(--bg);display:flex;justify-content:space-between;align-items:flex-start;
  box-shadow:0 -14px 22px -14px rgba(0,0,0,.10);
}
.nav__item{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);transition:color .15s ease}
.nav__item.is-on{color:var(--accent)}
.nav__ico{display:block;height:30px;width:36px;overflow:visible}
.nav__label{font-size:12px;line-height:14px;font-weight:400;white-space:nowrap}

/* ================= TOP BAR (sub pages) ================= */
.topbar{display:flex;align-items:center;gap:12px;height:44px;margin-bottom:18px}
.backbtn{width:36px;height:36px;flex:0 0 auto;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--text);transition:transform .15s ease}
.backbtn:active{transform:scale(.92)}
.backbtn svg{width:10px;height:10px}
.topbar__title{flex:1 1 auto;min-width:0;font-size:18px;line-height:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar__sub{font-size:11px;line-height:14px;font-weight:300;color:var(--muted-2)}

/* ================= BUTTONS ================= */
.btn{border-radius:99px;font-weight:600;font-size:12px;line-height:16px;white-space:nowrap;transition:transform .15s ease,filter .15s ease;text-align:center;display:inline-block}
.btn:active{transform:scale(.96)}
.btn--lg{display:block;width:100%;padding:14px 18px;font-size:14px;color:#fff;background:var(--accent);box-shadow:0 10px 22px rgba(236,99,55,.28)}
.btn--lg[disabled]{background:#d6d6d6;color:#fff;box-shadow:none;cursor:not-allowed}
.btn--outline{display:block;width:100%;padding:13px 18px;font-size:13px;border:1px solid var(--line);color:var(--text);background:#fff}

/* ================= GENERIC LIST CARD (sub pages) ================= */
.card{display:flex;gap:12px;padding:10px;background:#fff;border-radius:var(--r-card);width:100%;transition:transform .15s ease}
.card:active{transform:scale(.99)}
.card+.card{margin-top:10px}
.card__thumb{position:relative;flex:0 0 auto;width:72px;height:72px;border-radius:10px;overflow:hidden;background:#ddd}
.card__thumb img{width:100%;height:100%;object-fit:cover}
.card__body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.card__top{display:flex;align-items:flex-start;gap:8px}
.card__title{flex:1 1 auto;min-width:0;font-size:14px;line-height:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card__meta{margin-top:2px;font-size:10.5px;line-height:14px;font-weight:300;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card__foot{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{display:flex;align-items:baseline;gap:4px}
.price b{font-size:16px;line-height:16px;font-weight:700}
.price span{font-size:8.5px;line-height:9px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.tag{flex:0 0 auto;padding:2px 6px;border-radius:99px;font-size:8px;line-height:12px;letter-spacing:.3px;color:#fff;background:var(--accent);text-transform:uppercase}

/* ================= CLASSES PAGE: chips + 3-col grid ================= */
.chips{display:flex;gap:8px;padding-bottom:4px;margin-bottom:14px}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:99px;background:#fff;color:var(--muted-2);font-size:11.5px;font-weight:500;white-space:nowrap;transition:all .18s ease}
.chip.is-on{background:var(--accent);color:#fff}
.chip:active{transform:scale(.95)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-height:calc(100vh - 240px);padding:2px 2px 20px;overscroll-behavior:contain}
.tile{background:#fff;border-radius:11px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s ease}
.tile:active{transform:scale(.97)}
.tile__img{position:relative;width:100%;aspect-ratio:1;background:#ddd;overflow:hidden}
.tile__img img{width:100%;height:100%;object-fit:cover}
.tile__tag{position:absolute;top:5px;left:5px;padding:2px 5px;border-radius:99px;background:var(--accent);color:#fff;font-size:7px;letter-spacing:.3px;text-transform:uppercase}
.tile__body{padding:8px 8px 9px;display:flex;flex-direction:column;gap:3px;flex:1 1 auto}
.tile__title{font-size:11px;line-height:13.5px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile__meta{font-size:8.5px;line-height:11px;font-weight:300;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile__foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:4px;padding-top:5px}
.tile__price{font-size:12px;line-height:12px;font-weight:700}
.gridnote{display:none;margin-top:10px;text-align:center;font-size:10px;letter-spacing:.4px;color:var(--muted)}
.gridnote.is-on{display:block}

/* ================= DETAIL PAGES ================= */
.dhero{position:relative;height:200px;border-radius:14px;overflow:hidden;margin-bottom:18px;background:#ddd}
.dhero img{width:100%;height:100%;object-fit:cover}
.dhero__scrim{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.15) 55%,rgba(0,0,0,0) 100%)}
.dhero__body{position:absolute;left:16px;right:16px;bottom:14px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--accent);color:#fff;font-size:9px;line-height:13px;letter-spacing:.4px;text-transform:uppercase;font-weight:500}
.dhero__title{margin-top:8px;font-size:22px;line-height:26px;font-weight:600;color:#fff}
.dhero__meta{margin-top:5px;font-size:11.5px;font-weight:300;color:rgba(255,255,255,.9)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{padding:12px 10px;border-radius:12px;background:#fff;text-align:center}
.stat__v{font-size:20px;line-height:22px;font-weight:700}
.stat__v--accent{color:var(--accent)}
.stat__k{margin-top:3px;font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}

.block{margin-bottom:22px}
.block__h{font-size:15px;font-weight:600;margin-bottom:10px}
.prose{font-size:12.5px;line-height:19px;font-weight:300;color:var(--muted-2)}
.bullets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.bullets li{display:flex;gap:10px;font-size:12.5px;line-height:18px;font-weight:300;color:var(--muted-2)}
.bullets li::before{content:'✓';color:var(--accent);font-weight:700;flex:0 0 auto}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
.steps li::before{content:counter(s);flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;display:grid;place-items:center;font-weight:600}
.steps p{font-size:12.5px;line-height:18px;font-weight:300;color:var(--muted-2)}
.steps b{display:block;color:var(--text);font-size:13px;font-weight:500;margin-bottom:2px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv__k{font-size:12.5px;font-weight:300;color:var(--muted-2)}
.kv__v{font-size:12.5px;font-weight:500;text-align:right}

/* ================= CHALLENGE DETAIL / PROGRESS ================= */
.quest{padding:16px;border-radius:15px;background:#fff;width:100%;display:block;text-align:left}
.quest__top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.quest__count{font-size:11px;font-weight:300;color:var(--muted-2)}
.quest__title{margin-top:12px;font-size:16px;line-height:22px;font-weight:600}
.quest__reward{margin-top:3px;font-size:11.5px;font-weight:300;color:var(--muted-2)}
.progress{margin-top:14px;height:6px;border-radius:99px;background:var(--bg);overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .9s cubic-bezier(.3,.7,.3,1)}
.quest__foot{margin-top:8px;display:flex;justify-content:space-between;font-size:10.5px;font-weight:300;color:var(--muted-2)}
.chrow{display:flex;flex-direction:column;gap:10px;padding:10px;background:#fff;border-radius:var(--r-card);width:100%}
.chrow+.chrow{margin-top:10px}
.chrow__head{display:flex;gap:12px;align-items:center}
.chrow__img{flex:0 0 auto;width:64px;height:64px;border-radius:10px;overflow:hidden;background:#ddd}
.chrow__img img{width:100%;height:100%;object-fit:cover}

/* ================= BOOKING ================= */
.cal{display:flex;gap:8px;padding:2px 2px 6px}
.cal__day{flex:0 0 auto;width:54px;padding:10px 0 11px;border-radius:12px;text-align:center;background:#fff;transition:all .18s ease}
.cal__day.is-on{background:var(--accent);color:#fff}
.cal__day:active{transform:scale(.95)}
.cal__dow{font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.cal__day.is-on .cal__dow{color:rgba(255,255,255,.85)}
.cal__num{margin-top:3px;font-size:19px;line-height:20px;font-weight:700}
.cal__mon{font-size:8.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.cal__day.is-on .cal__mon{color:rgba(255,255,255,.8)}
.durations{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dur{padding:13px 8px;border-radius:12px;text-align:center;background:#fff;border:1px solid transparent;transition:all .18s ease}
.dur.is-on{border-color:var(--accent);color:var(--accent)}
.dur:active{transform:scale(.96)}
.dur__v{font-size:20px;line-height:20px;font-weight:700}
.dur__k{margin-top:2px;font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:236px;padding:2px 2px 6px;overscroll-behavior:contain}
.slot{padding:10px 4px;border-radius:10px;text-align:center;background:#fff;font-size:12px;font-weight:500;transition:all .16s ease}
.slot.is-on{background:var(--accent);color:#fff}
.slot.is-off{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.slot:not(.is-off):active{transform:scale(.95)}
.slotnote{margin-top:10px;display:flex;gap:14px;justify-content:center;font-size:9.5px;font-weight:300;color:var(--muted-2)}
.slotnote i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.summary{padding:14px 16px;border-radius:15px;background:#fff;margin-bottom:14px}
.summary__row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:5px 0}
.summary__row span:first-child{font-weight:300;color:var(--muted-2)}
.summary__row span:last-child{font-weight:500}
.summary__total{margin-top:8px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.summary__total b{font-size:24px;font-weight:700;color:var(--accent)}

/* ================= SHEET / TOAST ================= */
.sheet{position:fixed;inset:0;z-index:150;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);animation:fadeIn .22s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet__card{width:100%;max-width:var(--frame);background:#fff;border-radius:22px 22px 0 0;padding:26px 22px 30px;text-align:center;animation:sheetUp .32s cubic-bezier(.2,.9,.25,1) both}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet__logo{width:120px;height:auto;margin:0 auto 18px}
.sheet__icon{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff}
.sheet__icon svg{width:22px;height:22px}
.sheet__title{font-size:20px;font-weight:600}
.sheet__sub{margin-top:6px;font-size:12.5px;line-height:18px;font-weight:300;color:var(--muted-2)}
.sheet__box{margin:18px 0 20px;padding:4px 16px;border-radius:14px;background:var(--bg);text-align:left}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 12px);transform:translateX(-50%);z-index:160;padding:11px 20px;border-radius:99px;background:var(--text);color:#fff;font-size:12.5px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:toastIn .3s ease both;white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.empty{padding:48px 20px;text-align:center;color:var(--muted-2);font-size:12.5px;font-weight:300}

/* ================= DESKTOP ================= */
@media (min-width:768px){
  body{background:#dcdcdc}
  /* A real phone: 440 × 953 (19.5:9, the .ai artboard ratio). If the window is
     shorter than that, the whole phone is scaled down by JS (--phone-scale)
     so it always keeps its proportions. */
  .stage{align-items:flex-start;padding:24px;min-height:100vh}
  .phone{
    --phone-h:953px;
    flex:0 0 auto;width:var(--frame);height:var(--phone-h);min-height:0;
    border-radius:52px;border:12px solid #141414;
    box-shadow:0 0 0 2px #3a3a3a,0 40px 90px rgba(0,0,0,.35);
    overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;
    transform:scale(var(--phone-scale,1));transform-origin:top center;
    margin-bottom:calc((var(--phone-scale,1) - 1) * var(--phone-h));
  }
  .phone::-webkit-scrollbar{display:none}
  .phone>#app{flex:1 0 auto}
  .nav{position:sticky;transform:none;left:auto;bottom:0;flex:0 0 auto;margin-top:calc(-1 * var(--nav-h))}
  .grid3{max-height:560px}
  .sheet{align-items:center}
  .sheet__card{border-radius:22px;max-width:400px}
  .toast{bottom:40px}
}
@media (max-width:359px){
  :root{--gutter:14px}
  .hero__title{font-size:24px;line-height:28px}
  .slots{grid-template-columns:repeat(2,1fr)}
  .nav__label{font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

function calHTML() {

      '<div class="cal__dow">' + (i === 0 ? 'Today' : DOW[d.getDay()]) + '</div>' +

  return DURATIONS.map(function (m) {

      '<div class="dur__v">' + m + '</div><div class="dur__k">minutes</div></button>';
  }).join('');
}
function slotsHTML(v) {
  var d = addDays(new Date(), state.booking.dayIndex);
  var need = Math.ceil(state.booking.duration / 30), out = '';
  for (var m = OPEN_FROM; m + state.booking.duration <= OPEN_TO + 30; m += 30) {
    var free = true;
    for (var k = 0; k < need; k++) if (slotTaken(v.id, d, m + k * 30)) { free = false; break; }
    if (state.booking.dayIndex === 0) { var now = new Date(); if (m < now.getHours() * 60 + now.getMinutes() + 60) free = false; }
    out += '<button class="slot' + (free ? '' : ' is-off') + (state.booking.slot === m ? ' is-on' : '') + '"' +
      (free ? ' data-slot="' + m + '"' : ' disabled') + '>' + hhmm(m) + '</button>';
  }
  return out || '<p class="empty" style="grid-column:1/-1">Nothing left today — try tomorrow.</p>';
}
function summaryHTML(v) {
  var b = state.booking, d = addDays(new Date(), b.dayIndex);

  return '<div class="summary">' +

  '</div>' +

function toast(msg) {
  var old = $('.toast'); if (old) old.remove();
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2200);
}
function sheet(html) {
  var s = document.createElement('div'); s.className = 'sheet';
  s.innerHTML = '<div class="sheet__card">' + html + '</div>';
  s.addEventListener('click', function (e) { if (e.target === s || e.target.closest('[data-close]')) s.remove(); });
  document.body.appendChild(s);
}

  var b = state.booking, d = addDays(new Date(), b.dayIndex);

  sheet(
    '<img class="sheet__logo" src="' + IMG + 'logo.png" alt="Active Abu Dhabi">' +
    '<div class="sheet__icon">' + ICON.check + '</div>' +
    '<h3 class="sheet__title">Booking confirmed</h3>' +

    '<div class="sheet__box">' +

      '<div class="kv"><span class="kv__k">Venue</span><span class="kv__v">' + v.title + '</span></div>' +
      '<div class="kv"><span class="kv__k">Date</span><span class="kv__v">' + prettyDate(d) + '</span></div>' +
      '<div class="kv"><span class="kv__k">Time</span><span class="kv__v">' + hhmm(b.slot) + ' – ' + hhmm(b.slot + b.duration) + '</span></div>' +
      '<div class="kv"><span class="kv__k">Paid</span><span class="kv__v">' + total + ' AED</span></div>' +
    '</div>' +
    '<button class="btn btn--lg" data-close>Done</button>'
  );
}

/* ---------------------------------------------------------
   SLIDERS
   --------------------------------------------------------- */
function initSliders(root) {
  $$('[data-slider]', root).forEach(function (sl) {
    var track = $('[data-track]', sl), dotsEl = $('[data-dots]', sl);
    if (!track) return;
    var slides = track.children; if (!slides.length) return;
    var dots = []; dotsEl.innerHTML = '';
    for (var i = 0; i < slides.length; i++) {
      var dt = document.createElement('i'); dotsEl.appendChild(dt); dots.push(dt);
      (function (n) { dt.addEventListener('click', function () { goTo(n); }); })(i);
    }
    var current = 0;
    function setActive(n) { current = n; dots.forEach(function (d, i) { d.classList.toggle('is-on', i === n); }); }
    function goTo(n) { track.scrollTo({ left: track.clientWidth * n, behavior: 'smooth' }); setActive(n); }
    var t;
    track.addEventListener('scroll', function () {
      clearTimeout(t); t = setTimeout(function () { setActive(Math.round(track.scrollLeft / (track.clientWidth || 1))); }, 60);
    }, { passive: true });
    setActive(0);
    if (sl.getAttribute('data-slider') === 'banner') {
      var timer = setInterval(function () {
        if (document.hidden || !document.body.contains(track)) return;
        goTo((current + 1) % slides.length);
      }, 5000);
      ['pointerdown', 'touchstart'].forEach(function (ev) { sl.addEventListener(ev, function () { clearInterval(timer); }, { passive: true, once: true }); });
    }
  });
}

/* ---------------------------------------------------------
   ROUTER
   --------------------------------------------------------- */
var outlet;
var NAV_MAP = { '':'#/', 'events':'#/events', 'event':'#/events', 'classes':'#/classes', 'class':'#/classes',
  'rewards':'#/rewards', 'reward':'#/rewards', 'challenges':'#/challenges', 'challenge':'#/challenges', 'profile':'#/profile' };
function render() {
  var h = (location.hash || '#/').replace(/^#/, '');
  var parts = h.split('/').filter(Boolean);
  var html;
  switch (parts[0]) {
    case undefined:      html = viewHome(); break;
    case 'events':       html = viewEvents(); break;
    case 'event':        html = viewEvent(parts[1]); break;
    case 'classes':      html = viewClasses(); break;
    case 'class':        html = viewClass(parts[1]); break;
    case 'challenges':   html = viewChallenges(); break;
    case 'challenge':    html = viewChallenge(parts[1]); break;
    case 'rewards':      html = viewRewards(); break;
    case 'reward':       html = viewReward(parts[1]); break;
    case 'venues':       html = viewVenues(); break;
    case 'venue':        html = viewVenue(parts[1]); break;
    case 'profile':      html = viewProfile(); break;
    default:             html = notFound();
  }
  outlet.innerHTML = html;
  window.scrollTo(0, 0);
  var ph = $('#phone'); if (ph) ph.scrollTop = 0;
  initSliders(outlet);
  var active = NAV_MAP[parts[0] || ''] || null;
  $$('#nav .nav__item').forEach(function (b) { b.classList.toggle('is-on', b.getAttribute('data-nav') === active); });
  var g = $('.grid3'), note = $('.gridnote');
  if (g && note) note.classList.toggle('is-on', g.scrollHeight > g.clientHeight + 4);
}
function go(hash) { location.hash = hash; }

/* ---------------------------------------------------------
   EVENTS
   --------------------------------------------------------- */
function wire() {
  document.addEventListener('click', function (e) {
    var el;
    if ((el = e.target.closest('[data-nav]')))   { go(el.getAttribute('data-nav')); return; }
    if ((el = e.target.closest('[data-go]')))    { go(el.getAttribute('data-go')); return; }
    if ((el = e.target.closest('[data-back]')))  { history.length > 1 ? history.back() : go('#/'); return; }
    if ((el = e.target.closest('[data-toast]'))) { toast(el.getAttribute('data-toast')); return; }
    if ((el = e.target.closest('[data-filter]'))) { state.filter = el.getAttribute('data-filter'); render(); return; }
    if ((el = e.target.closest('[data-join]')))  { state.joined[el.getAttribute('data-join')] = true; render(); toast('Challenge joined — good luck!'); return; }
    if ((el = e.target.closest('[data-leave]'))) { delete state.joined[el.getAttribute('data-leave')]; render(); toast('You left the challenge'); return; }
    if ((el = e.target.closest('[data-book-class]'))) {
      var c = byId(CLASSES, el.getAttribute('data-book-class'));
      sheet('<img class="sheet__logo" src="' + IMG + 'logo.png" alt="Active Abu Dhabi">' +
        '<div class="sheet__icon">' + ICON.check + '</div><h3 class="sheet__title">Spot reserved</h3>' +
        '<p class="sheet__sub">' + c.title + ' · ' + c.when + '</p>' +
        '<div class="sheet__box">' +
          '<div class="kv"><span class="kv__k">Provider</span><span class="kv__v">' + c.provider + '</span></div>' +
          '<div class="kv"><span class="kv__k">Coach</span><span class="kv__v">' + c.coach + '</span></div>' +
          '<div class="kv"><span class="kv__k">Location</span><span class="kv__v">' + c.where + '</span></div>' +
          '<div class="kv"><span class="kv__k">Paid</span><span class="kv__v">' + c.price + ' AED</span></div>' +
        '</div><button class="btn btn--lg" data-close>Done</button>');
      return;
    }
    if ((el = e.target.closest('[data-day]'))) {
      state.booking.dayIndex = +el.getAttribute('data-day'); state.booking.slot = null;
      $$('#cal .cal__day').forEach(function (d, i) { d.classList.toggle('is-on', i === state.booking.dayIndex); });
      refreshBooking(); return;
    }
    if ((el = e.target.closest('[data-dur]'))) {
      state.booking.duration = +el.getAttribute('data-dur'); state.booking.slot = null;
      $$('#durs .dur').forEach(function (d) { d.classList.toggle('is-on', +d.getAttribute('data-dur') === state.booking.duration); });
      refreshBooking(); return;
    }
    if ((el = e.target.closest('[data-slot]'))) {
      state.booking.slot = +el.getAttribute('data-slot');
      $$('#slots .slot').forEach(function (s) { s.classList.toggle('is-on', +s.getAttribute('data-slot') === state.booking.slot); });
      refreshBooking(true); return;
    }
    if ((el = e.target.closest('[data-confirm]'))) { bookingSheet(byId(VENUES, el.getAttribute('data-confirm'))); return; }
  });
  window.addEventListener('hashchange', render);
}
function refreshBooking(slotsOnly) {
  var v = byId(VENUES, state.booking.venueId); if (!v) return;
  if (!slotsOnly) { var s = $('#slots'); if (s) s.innerHTML = slotsHTML(v); }
  var sum = $('#summary'); if (sum) sum.innerHTML = summaryHTML(v);
}

/* ---------------------------------------------------------
   BOOT
   --------------------------------------------------------- */
function fitPhone() {
  var ph = $('#phone'); if (!ph) return;
  if (window.innerWidth < 768) { ph.style.removeProperty('--phone-scale'); return; }
  var s = Math.min(1, (window.innerHeight - 48) / 953, (window.innerWidth - 48) / 440);
  ph.style.setProperty('--phone-scale', s.toFixed(4));
}
function boot() {
  outlet = $('#app'); wire(); render();
  fitPhone(); window.addEventListener('resize', fitPhone);
  var splash = $('#splash');
  setTimeout(function () { if (splash) { splash.classList.add('is-hidden'); setTimeout(function () { splash.remove(); }, 700); } }, SPLASH_MS);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
